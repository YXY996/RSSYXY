report:
  mode: current
  display_mode: keyword
  sort_by_position_first: true
  rank_threshold: 5
  max_news_per_keyword: 8
filter:
  method: keyword
  priority_sort_enabled: true
ai_filter:
  batch_size: 200
  batch_interval: 2
  min_score: 0.7
  reclassify_threshold: 0.6
  prompt_file: prompt.txt
  extract_prompt_file: extract_prompt.txt
  update_tags_prompt_file: update_tags_prompt.txt
display:
  region_order:
  - new_items
  - hotlist
  - rss
  - standalone
  - ai_analysis
  regions:
    hotlist: true
    new_items: false
    rss: true
    standalone: false
    ai_analysis: true
  standalone:
    platforms:
    - zhihu
    - wallstreetcn-hot
    rss_feeds: []
    max_items: 20
notification:
  enabled: true
  channels:
    feishu:
      webhook_url: ''
    dingtalk:
      webhook_url: ''
    wework:
      webhook_url: ''
      msg_type: markdown
    telegram:
      bot_token: ''
      chat_id: ''
    email:
      from: ''
      password: ''
      to: ''
      smtp_server: ''
      smtp_port: ''
    ntfy:
      server_url: https://ntfy.sh
      topic: ''
      token: ''
    bark:
      url: ''
    slack:
      webhook_url: ''
    generic_webhook:
      webhook_url: ''
      payload_template: ''
    xiaohongshu:
      user_data_dir: ''  # 已暂停：Playwright 用户数据目录（保存登录态），如：output/xhs_profile
      cover_image: ''    # 可选：自定义封面图路径
      topics: '#AI资讯 #每日热榜 #科技前沿'  # 话题标签
storage:
  backend: auto
  formats:
    sqlite: true
    txt: false
    html: true
  local:
    data_dir: output
    retention_days: 0
  remote:
    retention_days: 0
    endpoint_url: ''
    bucket_name: ''
    access_key_id: ''
    secret_access_key: ''
    region: ''
  pull:
    enabled: false
    days: 7
ai:
  model: openai/9router-free-auto
  api_key: ''  # 本地运行请设置环境变量 AI_API_KEY，勿提交明文密钥
  api_base: http://127.0.0.1:20129/v1
  timeout: 300
  temperature: 1.0
  max_tokens: 5000
  num_retries: 1
  fallback_models: []
ai_analysis:
  enabled: true
  language: Chinese
  prompt_file: ai_analysis_prompt.txt
  mode: follow_report
  max_news_for_analysis: 150
  include_rss: false
  include_standalone: true
  include_rank_timeline: true
ai_translation:
  enabled: true
  language: 中文
  prompt_file: ai_translation_prompt.txt
  batch_size: 100
  batch_interval: 2
  scope:
    hotlist: true
    rss: true
    standalone: true
advanced:
  debug: false
  version_check_url: https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version
  mcp_version_check_url: https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version_mcp
  configs_version_check_url: https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version_configs
  crawler:
    request_interval: 2000
    use_proxy: false
    default_proxy: http://127.0.0.1:10801
  rss:
    request_interval: 1000
    timeout: 15
    use_proxy: false
    proxy_url: ''
  weight:
    rank: 0.6
    frequency: 0.3
    hotness: 0.1
  max_accounts_per_channel: 3
  batch_size:
    default: 4000
    dingtalk: 20000
    feishu: 30000
    bark: 4000
    slack: 4000
  batch_send_interval: 3
  feishu_message_separator: ━━━━━━━━━━━━━━━━
