<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WISDOM SIGNAL · 消息源管理</title>
  <style>
    :root{--ink:#172033;--paper:#f4f7fb;--blue:#2f6df6;--teal:#168f91;--muted:#68748a;--line:#dce3ee;--surface:#fff}*{box-sizing:border-box}
    body{margin:0;color:var(--ink);background:linear-gradient(90deg,var(--blue) 0 7px,transparent 7px),var(--paper);font-family:"Yu Gothic UI","Microsoft YaHei UI",sans-serif}.shell{max-width:1180px;margin:auto;padding:24px}
    header{padding:30px 32px;border-radius:18px 18px 5px 5px;color:white;background:var(--ink)}.eyebrow{color:#8facff;font:700 11px/1 Bahnschrift,sans-serif;letter-spacing:.2em}h1{margin:9px 0 8px;font-size:34px;letter-spacing:-.04em}header p{margin:0;color:#b9c4d8;line-height:1.7}
    .notice{margin:14px 0 20px;padding:16px 20px;border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:5px 5px 12px 12px;background:#fff;color:var(--muted);font-size:13px}
    section{margin:16px 0;padding:20px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}h2{margin:0;font-size:18px}.count{color:var(--muted);font-size:12px}
    .row{display:grid;grid-template-columns:34px 1fr 1.2fr 2fr 42px;gap:10px;align-items:center;padding:10px 0;border-top:1px solid #edf1f6}.row.platform{grid-template-columns:34px 1fr 1.3fr 1.5fr 42px}.row:first-child{border-top:0}
    input{width:100%;height:38px;padding:0 10px;border:1px solid var(--line);border-radius:7px;color:var(--ink);background:#fbfcfe}input:focus{outline:3px solid rgba(47,109,246,.14);border-color:var(--blue)}input[type=checkbox]{width:18px;height:18px;accent-color:var(--blue)}
    button{min-height:38px;padding:0 15px;border:1px solid var(--line);border-radius:8px;color:var(--ink);background:#fff;font-weight:650;cursor:pointer}button:hover{border-color:#aebbd0}.primary{color:#fff;border-color:var(--blue);background:var(--blue)}.danger{padding:0;width:38px;color:#b14242}.actions{position:sticky;bottom:0;display:flex;justify-content:flex-end;gap:10px;padding:16px 0;background:linear-gradient(transparent,var(--paper) 25%)}#status{margin-right:auto;align-self:center;color:var(--muted);font-size:13px}.ok{color:var(--teal)!important}.bad{color:#b14242!important}
    @media(max-width:780px){.shell{padding:0 10px 16px}header{margin:0 -10px;padding:24px 20px;border-radius:0 0 12px 12px}.row,.row.platform{grid-template-columns:28px 1fr 38px}.row input:nth-of-type(n+2){grid-column:2/3}.actions{flex-wrap:wrap}}
  </style>
</head>
<body><main class="shell">
  <header><div class="eyebrow">LOCAL CONTROL / NO PUBLIC TOKEN</div><h1>消息源管理</h1><p>在本机增删来源；保存并同步后，GitHub 会在下次抓取时采用新清单。</p></header>
  <div class="notice">这个页面只在你的电脑上运行。GitHub 凭据由系统凭据管理器处理，不会进入网页或仓库。</div>
  <section><div class="section-head"><h2>热榜平台</h2><div><span id="platformCount" class="count"></span> <button onclick="addPlatform()">添加平台</button></div></div><div id="platforms"></div></section>
  <section><div class="section-head"><h2>RSS 订阅</h2><div><span id="rssCount" class="count"></span> <button onclick="addRss()">添加 RSS</button></div></div><div id="rss"></div></section>
  <div class="actions"><span id="status">正在读取…</span><button onclick="save(false)">仅保存本机</button><button class="primary" onclick="save(true)">保存并同步 GitHub</button></div>
</main><script>
const token='__CSRF_TOKEN__';const statusEl=document.querySelector('#status');let data={platforms:[],rss:[]};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(){document.querySelector('#platforms').innerHTML=data.platforms.map((x,i)=>`<div class="row platform"><input aria-label="启用" type="checkbox" ${x.enabled!==false?'checked':''} onchange="data.platforms[${i}].enabled=this.checked"><input aria-label="平台 ID" value="${esc(x.id)}" oninput="data.platforms[${i}].id=this.value" placeholder="平台 ID"><input aria-label="平台名称" value="${esc(x.name)}" oninput="data.platforms[${i}].name=this.value" placeholder="显示名称"><input aria-label="预期域名" value="${esc(x.expected_domain)}" oninput="data.platforms[${i}].expected_domain=this.value" placeholder="example.com"><button class="danger" onclick="data.platforms.splice(${i},1);render()">×</button></div>`).join('');
document.querySelector('#rss').innerHTML=data.rss.map((x,i)=>`<div class="row"><input aria-label="启用" type="checkbox" ${x.enabled!==false?'checked':''} onchange="data.rss[${i}].enabled=this.checked"><input aria-label="RSS ID" value="${esc(x.id)}" oninput="data.rss[${i}].id=this.value" placeholder="rss-id"><input aria-label="RSS 名称" value="${esc(x.name)}" oninput="data.rss[${i}].name=this.value" placeholder="显示名称"><input aria-label="RSS 地址" value="${esc(x.url)}" oninput="data.rss[${i}].url=this.value" placeholder="https://…"><button class="danger" onclick="data.rss.splice(${i},1);render()">×</button></div>`).join('');
platformCount.textContent=`${data.platforms.length} 个`;rssCount.textContent=`${data.rss.length} 个`;}
function addPlatform(){data.platforms.push({id:'new-platform',name:'新平台',expected_domain:'',enabled:false});render()}function addRss(){data.rss.push({id:'new-rss',name:'新 RSS',url:'https://example.com/feed.xml',enabled:false,max_age_days:3});render()}
async function save(sync){statusEl.className='';statusEl.textContent=sync?'正在同步…':'正在保存…';try{const res=await fetch(sync?'/api/sync':'/api/sources',{method:'POST',headers:{'content-type':'application/json','x-source-admin-token':token},body:JSON.stringify(data)});const out=await res.json();if(!res.ok)throw new Error(out.error);statusEl.className='ok';statusEl.textContent=out.message}catch(e){statusEl.className='bad';statusEl.textContent=e.message}}
fetch('/api/sources').then(r=>r.json()).then(x=>{data=x;render();statusEl.textContent='已载入当前清单'}).catch(e=>{statusEl.className='bad';statusEl.textContent=e.message});
  </script></body></html>
